name: map

on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            site/map
            state
          key: site-${{ github.run_id }}
          restore-keys: site-
      - run: python test_stats.py
      - run: node test_web.mjs
      - run: python sync.py
        env:
          EXAROTON_TOKEN: ${{ secrets.EXAROTON_TOKEN }}
          EXAROTON_SERVER: ${{ secrets.EXAROTON_SERVER }}
      - run: python stats.py
        env:
          EXAROTON_TOKEN: ${{ secrets.EXAROTON_TOKEN }}
          EXAROTON_SERVER: ${{ secrets.EXAROTON_SERVER }}
      - run: cp -r web/. site/ && rm site/spieler.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
